<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수급오실레이터</title>
<!-- 차트 라이브러리. 첫 번째가 실패하면 두 번째에서 다시 받습니다. -->
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';s.onerror=function(){window.__chartFail=true;};document.head.appendChild(s);"></script>
<style>
  :root {
    --void:#F2F4F9; --surface:#FFFFFF; --surface2:#F0F2F8; --hair:#E1E5F0;
    --textPri:#131A2C; --textSec:#5B6483; --textTer:#8B94B0;
    --up:#E5484D; --down:#2F6FED; --signature:#6D4FE0;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--void); color: var(--textPri); font-family: var(--sans); margin:0; padding:24px 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .between { display:flex; align-items:center; justify-content:space-between; }
  .card { background: var(--surface); border:1px solid var(--hair); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow: 0 1px 3px rgba(19,26,44,0.06); }
  .eyebrow { font-size:11px; letter-spacing:2px; color:var(--textTer); font-family:var(--mono); }
  h1 { font-size:22px; margin:2px 0 0; }
  input[type=text] { background: var(--surface2); border:1px solid var(--hair); color:var(--textPri); border-radius:8px; padding:8px 12px; font-family:var(--mono); font-size:14px; width:140px; }
  button { background: var(--signature); border:none; color:#fff; padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer; font-family:var(--sans); font-weight:600; }
  .status { font-size:12px; color:var(--textTer); }
  .warning { border:1px dashed var(--up); border-radius:12px; padding:10px 14px; font-size:12px; color:var(--up); margin-bottom:16px; }
  .notice { border:1px dashed var(--hair); border-radius:12px; padding:10px 14px; font-size:12px; color:var(--textTer); margin-bottom:16px; }
  /* 두 칸 유지에 필요한 최소폭 = 차트 420 + 목록 300 + 간격 16 ≈ 736.
     .wrap 이 980px 라 그 아래로 내려가면 차트가 눌려 겹쳐 보였습니다.
     화면 폭이 아니라 '이 상자가 실제로 넓은가'를 기준으로 바꿉니다. */
  .split { display:grid; grid-template-columns: minmax(420px,1fr) minmax(280px,300px);
           gap:16px; align-items:start; }
  @media (max-width: 780px) { .split { grid-template-columns: minmax(0,1fr); } }

  .pick-tabs { display:flex; gap:6px; margin-bottom:12px; }
  .pick-tab { flex:1; border:1px solid var(--hair); background:var(--surface); color:var(--textSec);
              border-radius:14px; padding:7px 6px; font-size:11.5px; font-family:inherit; cursor:pointer; font-weight:400;
              line-height:1.35; text-align:center; white-space:pre-line; }
  .pick-tab.on { background:var(--textPri); border-color:var(--textPri); color:#fff; }
  .pick-scroll { max-height:640px; overflow-y:auto; }
  .pick-row { display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid var(--hair);
              cursor:pointer; border-radius:6px; }
  .pick-row:hover { background:var(--surface2); }
  .pick-row.on { background:var(--surface2); box-shadow: inset 2px 0 0 var(--signature); }
  .pick-no { font-family:var(--mono); font-size:10.5px; color:var(--textTer); width:20px; flex:none; text-align:right; }
  .pick-name { font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pick-mkt { font-family:var(--mono); font-size:9.5px; color:var(--textTer); margin-left:4px; }
  .pick-val { font-family:var(--mono); font-size:12px; font-weight:600; flex:none; width:58px; text-align:right; }
  .rs-badge { font-family:var(--mono); font-size:10px; font-weight:600; flex:none; width:26px; text-align:center;
              border-radius:5px; padding:2px 0; }
  .rs-hot  { background:#E5484D; color:#fff; }
  .rs-warm { background:#FBE3D6; color:#B8560A; }
  .rs-cool { background:var(--surface2); color:var(--textTer); }
  .rs-none { background:transparent; color:var(--hair); }
  .pick-meta { font-size:10.5px; color:var(--textTer); font-family:var(--mono); margin-bottom:8px; }

  #chart { width:100%; height:420px; }
  #oscChart { width:100%; height:140px; }

  /* RS 거르기 버튼 */
  .rs-filter { display:flex; gap:6px; padding:2px 0 8px; flex-wrap:wrap; }
  .rs-filter button { background:var(--surface2); border:1px solid var(--hair); color:var(--textSec);
                      padding:5px 11px; border-radius:8px; font-size:11px; cursor:pointer; font-family:var(--sans); }
  .rs-filter button.on { background:var(--signature); border-color:var(--signature); color:#fff; font-weight:600; }
  .mark { font-size:9.5px; font-weight:700; padding:1px 4px; border-radius:4px; margin-left:4px; vertical-align:1px; }
  .mark-hi { background:#FDEBEC; color:#E5484D; }
  .mark-al { background:#EDE9FB; color:#6D4FE0; }

  /* 좁은 화면에서 제목과 버튼이 한 줄을 다투지 않게 합니다 */
  .between { flex-wrap: wrap; }
  h1 { white-space: nowrap; }
  @media (max-width: 860px) {
    .between > div:first-child { width: 100%; }
    .between > .row, .between > div:last-child { width: 100%; }
    h1 { font-size: 19px; }
  }
  @media (max-width: 560px) {
    body { padding: 16px 12px; }
    .card { padding: 14px; border-radius: 13px; }
    .between > .row button, .between > div:last-child button { font-size: 11px; padding: 7px 10px; }
    h1 { font-size: 18px; }
  }
  /* 오늘의 주도주 */
  .ld-head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .ld-tabs { display:flex; gap:5px; flex-wrap:wrap; }
  .ld-tabs button { background:var(--surface2); border:1px solid var(--hair); color:var(--textSec);
                    padding:5px 11px; border-radius:9px; font-size:11.5px; cursor:pointer; font-family:var(--sans); }
  .ld-tabs button.on { background:var(--signature); border-color:var(--signature); color:#fff; font-weight:600; }
  .ld-tabs button b { font-family:var(--mono); font-weight:700; margin-left:4px; opacity:.8; }
  .ld-wrap { overflow-x:auto; }
  .ld-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  .ld-tbl th { text-align:right; font-size:10.5px; font-weight:500; color:var(--textTer);
               padding:6px 8px; border-bottom:1px solid var(--hair); white-space:nowrap; }
  .ld-tbl td { text-align:right; padding:8px; border-bottom:1px solid var(--surface2); white-space:nowrap; }
  .ld-tbl th:first-child, .ld-tbl td:first-child { text-align:left; }
  .ld-tbl tr:last-child td { border-bottom:none; }
  .ld-tbl tbody tr:hover { background:var(--surface2); }
  .ld-nm { font-weight:600; cursor:pointer; }
  .ld-nm:hover { color:var(--signature); text-decoration:underline; }
  .ld-cd { font-family:var(--mono); font-size:9.5px; color:var(--textTer); margin-left:5px; }
  .ld-num { font-family:var(--mono); }
  .ld-st { font-size:10.5px; padding:2px 7px; border-radius:6px; font-weight:600; }
  .st-turn { background:#FDEBEC; color:#C0303A; }        /* 양수 전환 */
  .st-up   { background:#FEF3E6; color:#9A6210; }        /* 양수에서 상승 */
  .st-flat { background:var(--surface2); color:var(--textSec); }
  .st-rev  { background:#EEF3FE; color:#2F6FED; }        /* 음수에서 반등 */
  .st-down { background:#E7EEFC; color:#1D4ED8; }        /* 음수 전환 */
  .ld-score { display:inline-block; min-width:20px; font-family:var(--mono); font-weight:700; }
  .ld-tag { font-size:9.5px; padding:1px 5px; border-radius:5px; margin-right:3px; }
  .tag-th { background:#F1EEFC; color:var(--signature); }
  .tag-hi { background:#FDEBEC; color:#E5484D; }
  .tag-al { background:#EDE9FB; color:#6D4FE0; }
  .ld-note { font-size:11px; color:var(--textTer); margin-top:10px; line-height:1.7; }
  @media (max-width:560px) { .ld-tbl { font-size:11.5px; } .ld-tbl td, .ld-tbl th { padding:6px 5px; } }
  /* 메뉴 버튼 — 글자가 세로로 쪼개지지 않게, 조금 크고 굵게 */
  button, .between a button { white-space: nowrap; }
  .between > div:last-child button { font-size: 13px; font-weight: 600; }
  @media (max-width: 640px) {
    .between > div:last-child { gap: 6px; flex-wrap: wrap; }
    .between > div:last-child button { font-size: 12.5px; font-weight: 600; padding: 8px 11px; }
    .between > div:last-child a { display: inline-flex; }
  }
  @media (max-width: 400px) {
    .between > div:last-child button { font-size: 12px; padding: 7px 10px; }
  }

  /* ── 휴대폰 공통 다듬기 ───────────────────── */
  @media (max-width: 640px) {
    /* 너무 작아 안 읽히는 글씨 최소 10.5px */
    .ls-tk, .rank-code, .sup-mkt, .ld-cd, .ld-tag, .tag, .cal-more,
    .bd-k, .bd-s, .ai-time, .ai-badge, .tl-time, .day-sub { font-size: 10.5px !important; }
    /* 표는 좌우로 밀어 볼 수 있게 */
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
    /* 손가락으로 누르기 좋게 */
    button, .between a button { min-height: 34px; }
    /* 카드 안쪽 여백 줄여 화면을 넓게 */
    .card { padding: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">

    <div>
      <div class="eyebrow">수급오실레이터</div>
      <h1>수급오실레이터</h1>
    </div>
    <div style="display:flex;gap:8px;">

<script>
if (typeof LightweightCharts === "undefined") {
  document.getElementById('statusText').textContent = "차트 라이브러리를 불러오지 못했습니다. 새로고침(Ctrl+Shift+R)을 눌러보세요.";
  throw new Error("LightweightCharts 로드 실패");
}
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  layout: { background: { color: '#FFFFFF' }, textColor: '#5B6483' },
  grid: { vertLines: { color: '#E1E5F0' }, horzLines: { color: '#E1E5F0' } },
  timeScale: { borderColor: '#E1E5F0' },
  rightPriceScale: { borderColor: '#E1E5F0' },
});
const candleSeries = chart.addCandlestickSeries({
  upColor: '#E5484D', downColor: '#2F6FED',
  borderUpColor: '#E5484D', borderDownColor: '#2F6FED',
  wickUpColor: '#E5484D', wickDownColor: '#2F6FED',
});

// 캔들 차트 위에 오실레이터를 겹쳐 그리기 위한 별도 축(값 크기가 달라도 화면 안에 맞춰 표시됨)
const oscOverlay = chart.addLineSeries({
  color: '#E5484D',
  lineWidth: 2,
  priceScaleId: 'osc-overlay',
});
chart.priceScale('osc-overlay').applyOptions({
  scaleMargins: { top: 0.1, bottom: 0.1 },
  visible: false,
});

const oscChart = LightweightCharts.createChart(document.getElementById('oscChart'), {
  layout: { background: { color: '#FFFFFF' }, textColor: '#5B6483' },
  grid: { vertLines: { color: '#E1E5F0' }, horzLines: { color: '#E1E5F0' } },
  timeScale: { borderColor: '#E1E5F0' },
  rightPriceScale: { borderColor: '#E1E5F0' },
});
const oscSeries = oscChart.addHistogramSeries({ color: '#6D4FE0' });
const oscLine = oscChart.addLineSeries({ color: '#000000', lineWidth: 1 });

// 두 차트의 좌우 스크롤(시간축)을 동기화
chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  if (range) oscChart.timeScale().setVisibleLogicalRange(range);
});
oscChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  if (range) chart.timeScale().setVisibleLogicalRange(range);
});

function fmtDate(d){
  // YYYYMMDD -> YYYY-MM-DD
  return d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6,8);
}

async function loadData(code){
  const statusEl = document.getElementById('statusText');
  const warnEl = document.getElementById('warningBox');
  statusEl.textContent = code + " 조회 중...";
  warnEl.innerHTML = "";
  try {
    const r = await fetch("/api/flow-oscillator?code=" + encodeURIComponent(code), { cache: "no-store" });
    const data = await r.json();
    if (data.error) {
      statusEl.textContent = "오류: " + data.message;
      return;
    }
    const series = data.series || [];
    if (series.length === 0) {
      statusEl.textContent = "데이터가 없습니다.";
      return;
    }
    candleSeries.setData(series.map(s => ({
      time: fmtDate(s.date), open: s.open, high: s.high, low: s.low, close: s.close,
    })));
    oscOverlay.setData(series.map(s => ({
      time: fmtDate(s.date), value: s.oscillator,
    })));
    oscSeries.setData(series.map(s => ({
      time: fmtDate(s.date), value: s.oscillator,
      color: s.oscillator >= 0 ? '#E5484D' : '#2F6FED',
    })));
    oscLine.setData(series.map(s => ({
      time: fmtDate(s.date), value: s.oscillator,
    })));
    // 처음에는 최근 6개월(약 120거래일)만 보여줍니다.
    // 마우스로 끌거나 휠을 돌리면 예전 구간도 볼 수 있습니다.
    const SHOW_BARS = 120;
    if (series.length > SHOW_BARS) {
      const from = series.length - SHOW_BARS;
      chart.timeScale().setVisibleLogicalRange({ from, to: series.length - 1 + 3 });
    } else {
      chart.timeScale().fitContent();
      oscChart.timeScale().fitContent();
    }

    statusEl.textContent = code + " · " + series.length + "거래일 · 최근 업데이트 " + new Date().toLocaleTimeString("ko-KR");

    if (data.unitWarning) {
      warnEl.innerHTML = `<div class="warning">⚠ ${data.unitWarning}</div>`;
    } else if (data.warmupNotice) {
      warnEl.innerHTML = `<div class="notice">${data.warmupNotice}</div>`;
    }
  } catch (e) {
    statusEl.textContent = "불러오지 못했습니다: " + e;
  }
}

// ── 종목 고르기 목록 ──────────────────────────────────────
// 왼쪽 차트를 종목코드 입력 없이 바로 바꿔 볼 수 있게 합니다.
const PICK = { up: null, prog: null, orgn: null, samo: null, rs: null };
let RS = {};          // 종목코드 → RS 값
let RS_DATE = "";
let RS_FILTER = "all";   // all / high60 / aligned / both
let RS_ALL = [];         // 거르기 전 원본
let TREND = {};          // 종목코드 → {high60, aligned}
let RS_VALID = true;     // 신고가·정배열을 믿어도 되는지
let PICK_SRC = "up";
let PICK_CODE = null;

const fmtPct = v => v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%";

// RS 배지. 90 이상이면 진하게, 70 이상이면 옅게 표시합니다.
function rsBadge(code) {
  const v = RS[code];
  if (v == null) return `<span class="rs-badge rs-none">·</span>`;
  const cls = v >= 90 ? "rs-hot" : (v >= 70 ? "rs-warm" : "rs-cool");
  return `<span class="rs-badge ${cls}">${v}</span>`;
}

// 신고가·정배열 표시. rs.json 에 없는 종목(시총 3,000억 미만)은 표시가 없습니다.
function trendMark(code) {
  const t = TREND[code];
  if (!t) return "";
  return (t.high60 ? '<span class="mark mark-hi">新</span>' : '')
       + (t.aligned ? '<span class="mark mark-al">정</span>' : '');
}

// 어느 탭이든 같은 기준으로 거릅니다.
function trendPass(code) {
  if (RS_FILTER === "all") return true;
  const t = TREND[code];
  if (!t) return false;
  if (RS_FILTER === "high60") return t.high60;
  if (RS_FILTER === "aligned") return t.aligned;
  return t.high60 && t.aligned;
}

function applyRsFilter() {
  return RS_ALL.filter(r => trendPass(r.code)).slice(0, 50);
}

function pickRows() {
  const list = PICK[PICK_SRC];
  if (PICK_SRC === "rs") {
    if (!list) return `<div class="status">불러오는 중...</div>`;
    if (!list.length) return `<div class="status">${RS_FILTER === "all" ? "rs.json 파일이 없습니다." : "해당하는 종목이 없습니다."}</div>`;
    return list.map((r, i) => `
      <div class="pick-row${r.code === PICK_CODE ? " on" : ""}" data-code="${r.code}">
        <span class="pick-no">${i + 1}</span>
        <span class="pick-name">${r.name}<span class="pick-mkt">${r.market === "KOSPI" ? "KP" : "KQ"}</span>${trendMark(r.code)}</span>
        ${rsBadge(r.code)}
        <span class="pick-val" style="color:${r.m3 >= 0 ? '#E5484D' : '#2F6FED'}">${fmtPct(r.m3)}</span>
      </div>`).join("");
  }
  if (!list) return `<div class="status">불러오는 중...</div>`;
  if (!list.length) return `<div class="status">데이터가 없습니다.</div>`;

  const shown = list.filter(r => trendPass(r.code));
  if (!shown.length) return `<div class="status">해당하는 종목이 없습니다.</div>`;

  return shown.map((r, i) => `
    <div class="pick-row${r.code === PICK_CODE ? " on" : ""}" data-code="${r.code}">
      <span class="pick-no">${i + 1}</span>
      <span class="pick-name">${r.name}<span class="pick-mkt">${r.market === "KOSPI" ? "KP" : "KQ"}</span>${trendMark(r.code)}</span>
      ${rsBadge(r.code)}
      <span class="pick-val" style="color:${(r.value ?? 0) >= 0 ? '#E5484D' : '#2F6FED'}">${fmtPct(r.value)}</span>
    </div>`).join("");
}

function paintPick() {
  document.getElementById("rsFilter").style.display = "flex";
  document.getElementById("pickTabs").querySelectorAll(".pick-tab").forEach(b => {
    b.classList.toggle("on", b.dataset.src === PICK_SRC);
  });
  const el = document.getElementById("pickList");
  el.innerHTML = pickRows();
  el.querySelectorAll(".pick-row").forEach(row => {
    row.addEventListener("click", () => {
      PICK_CODE = row.dataset.code;
      document.getElementById("codeInput").value = PICK_CODE;
      paintPick();
      loadData(PICK_CODE);
    });
  });
  // 거른 결과를 안내 문구에 덧붙입니다.
  let extra = "";
  const cur = PICK[PICK_SRC];
  if (cur && cur.length) {
    const base = (PICK_SRC === "rs") ? RS_ALL : cur;
    const noData = base.filter(r => !TREND[r.code]).length;
    if (RS_FILTER !== "all") {
      const hit = base.filter(r => trendPass(r.code)).length;
      extra = ` · ${base.length}종목 중 ${hit}종목`;
      if (noData) extra += ` (자료없음 ${noData})`;
    } else if (noData) {
      extra = ` · 시총 3,000억 미만 ${noData}종목은 新·정 표시 없음`;
    }
  }
  if (!RS_VALID) extra += " · ⚠ 신고가·정배열 계산 안 됨";

  const notes = {
    up: "거래대금 상위 150 중 등락률 순 · 하락장에서는 덜 빠진 순",
    prog: "장중 · 시총대비 프로그램 순매수 순",
    orgn: "장중 잠정 · 기관합계 시총대비 순매수 순",
    samo: "마감 확정 · 시총대비 순매수 순",
    rs: "상대강도 상위 · 오른쪽은 3개월 수익률" + (RS_DATE ? " · " + RS_DATE : ""),
  };
  document.getElementById("pickMeta").textContent = (notes[PICK_SRC] || "") + extra;
}

// ETF·상장지수·스팩·리츠는 종목 고르는 목록에서 뺍니다.
const ETF꼴 = /(^|\s)(KODEX|TIGER|PLUS|ACE|SOL|RISE|HANARO|KOSEF|ARIRANG|TIMEFOLIO|KIWOOM|SMART|FOCUS|BNK|WOORI|마이다스|히어로즈|파워|TREX|UNICORN|VITA|이지스|하이|마이티)\s|(레버리지|인버스|선물\s?ETN|\bETN\b|스팩|리츠)/i;
const ETF빼기 = a => (a || []).filter(x => !ETF꼴.test(x.name || ""));

async function loadPicks() {
  // 1) 거래대금 상위 150 중 등락률 상위 50 (하락장이면 덜 빠진 순)
  try {
    const d = await (await fetch("/api/trade-rank", { cache: "no-store" })).json();
    PICK.up = ETF빼기((d.up50 || []).map(r => ({ code: r.code, name: r.name, market: r.market, value: r.changePct })));
  } catch (e) { PICK.up = []; }

  // 2) 장중 · 시총대비 프로그램 순매수 상위 50
  try {
    const p = await (await fetch("/api/program-flow", { cache: "no-store" })).json();
    PICK.prog = ETF빼기((p.buy || []).map(r => ({ code: r.code, name: r.name, market: r.market, value: r.ratio })));
  } catch (e) { PICK.prog = []; }

  // 0) RS (하루 한 번 갱신되는 파일)
  try {
    const j = await (await fetch("/rs.json", { cache: "no-store" })).json();
    RS = {};
    const list = [];
    for (const [code, v] of Object.entries(j.data || {})) {
      RS[code] = v.rs;
      TREND[code] = { high60: !!v.high60, aligned: !!v.aligned };
      list.push({ code, name: v.name, market: v.market, value: v.rs, m3: v.m3,
                  high60: !!v.high60, aligned: !!v.aligned });
    }
    RS_DATE = j.date || "";
    RS_VALID = j.trendValid !== false;
    RS_ALL = list.sort((a, b) => b.value - a.value || b.m3 - a.m3);
    PICK.rs = applyRsFilter();
  } catch (e) { PICK.rs = []; }

  // 3) 장중 잠정 · 기관합계 시총대비 순매수
  try {
    const g = await (await fetch("/api/supply-ratio", { cache: "no-store" })).json();
    const side = (g.data && g.data["기관합계"]) || {};
    PICK.orgn = ETF빼기((side.buy || [])
      .map(r => ({ code: r.code, name: r.name, market: r.market, value: r.ratio }))).slice(0, 30);
  } catch (e) { PICK.orgn = []; }

  // 4) 마감 확정 · 사모펀드 시총대비 순매수 상위 20
  try {
    const f = await (await fetch("/supply_final.json", { cache: "no-store" })).json();
    const side = (f.data && (f.data["사모"] || f.data["사모펀드"])) || {};
    PICK.samo = ETF빼기((side.buy || [])
      .map(r => ({ code: r.code, name: r.name, market: r.market, value: r.ratio }))).slice(0, 20);
  } catch (e) { PICK.samo = []; }

  paintPick();
}

document.getElementById("pickTabs").addEventListener("click", (e) => {
  const b = e.target.closest(".pick-tab");
  if (!b) return;
  PICK_SRC = b.dataset.src;
  paintPick();
});

loadPicks();

document.getElementById('fitBtn').addEventListener('click', () => {
  chart.timeScale().fitContent();
  oscChart.timeScale().fitContent();
});

document.getElementById('loadBtn').addEventListener('click', () => {
  const code = document.getElementById('codeInput').value.trim();
  if (code) { PICK_CODE = code; paintPick(); loadData(code); }
});
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('loadBtn').click();
});

loadData(document.getElementById('codeInput').value.trim());

// RS 거르기 버튼
document.querySelectorAll("[data-rsf]").forEach(b => {
  b.addEventListener("click", () => {
    RS_FILTER = b.dataset.rsf;
    document.querySelectorAll("[data-rsf]").forEach(x => x.classList.toggle("on", x === b));
    PICK.rs = applyRsFilter();
    paintPick();
  });
});

// ── 차트 크기 따라가기 ────────────────────────────
// lightweight-charts 는 만들어질 때의 폭을 기억합니다.
// 화면을 확대하거나 창을 줄이면 칸은 좁아지는데 차트는 그대로라
// 오른쪽 목록 위로 삐져나옵니다. 칸 크기를 지켜보다 맞춰줍니다.
(function 크기맞추기() {
  const 짝 = [
    [document.getElementById('chart'), chart],
    [document.getElementById('oscChart'), oscChart],
  ].filter(([el, c]) => el && c);

  function 맞춤() {
    for (const [el, c] of 짝) {
      const w = Math.floor(el.clientWidth);
      if (w > 0) c.applyOptions({ width: w });
    }
  }

  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => requestAnimationFrame(맞춤));
    for (const [el] of 짝) ro.observe(el);
  }
  window.addEventListener("resize", () => requestAnimationFrame(맞춤));
  requestAnimationFrame(맞춤);
})();
</script>
<script>
// ── 위아래 차트 맞추기 (가격 축 폭 + 오실레이터 숫자 자릿수) ──
//  위 캔들 차트는 오른쪽 축에 가격(198800.00)이 있고 아래는 작은 값(-0.00)이라
//  축 폭이 달라 그림이 좌우로 어긋납니다. 두 축 중 넓은 쪽 폭에 맞춥니다.
(function () {
  try {
    if (typeof chart === 'undefined' || typeof oscChart === 'undefined') return;
  } catch (e) { return; }

  const 표시 = v => {
    const a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 100) return v.toFixed(0);
    if (a >= 1) return v.toFixed(2);
    if (a >= 0.01) return v.toFixed(4);
    return v.toPrecision(3);
  };
  const 형식 = { type: 'custom', formatter: 표시, minMove: 0.000001 };
  try { oscSeries.applyOptions({ priceFormat: 형식 }); } catch (e) {}
  try { oscLine.applyOptions({ priceFormat: 형식 }); } catch (e) {}
  try { oscOverlay.applyOptions({ priceFormat: 형식 }); } catch (e) {}

  function 축맞춤() {
    try {
      const 위 = chart.priceScale('right').width();
      const 아래 = oscChart.priceScale('right').width();
      const 폭 = Math.max(위, 아래, 60);
      chart.priceScale('right').applyOptions({ minimumWidth: 폭 });
      oscChart.priceScale('right').applyOptions({ minimumWidth: 폭 });
    } catch (e) {}
  }
  setInterval(축맞춤, 800);
  window.addEventListener('resize', () => requestAnimationFrame(축맞춤));
})();

// 이 페이지는 색을 CSS 변수로 쓰므로 여기서 값을 정해 둡니다.
const UP = "#E5484D", DOWN = "#2F6FED";

// ── 오늘의 주도주 ────────────────────────────────
// 거래대금 상위 150 중 등락률 상위 50을 서버가 미리 훑어 둡니다.
// 오실레이터 상태별로 나눠 보여 줍니다. 점수 하나로 줄이면 과매수 종목이 높게 나와 판단이 흐려집니다.
let LD = null, LD_TAB = "양수 전환", 주도주다시 = null;
const 상태색 = {
  "양수 전환": "st-turn", "양수에서 상승": "st-up",
  "양수이나 둔화": "st-flat", "음수에서 반등": "st-rev",
  "음수 전환": "st-down", "내림세": "st-flat", "자료 없음": "st-flat",
};
function 주도주고르기() {
  const a = (LD && LD.items) || [];
  if (LD_TAB === "전체") return a;
  return a.filter(x => x.상태 === LD_TAB);
}

function 주도주그리기() {
  const 몸 = document.getElementById("ldBody");
  const 탭 = document.getElementById("ldTabs");
  if (!LD) { 몸.innerHTML = `<div class="status" style="padding:14px 0;">불러오지 못했습니다.</div>`; return; }
  if (!(LD.items || []).length) {
    // 서버가 아직 훑는 중입니다. 50종목을 하나씩 부르느라 1분 남짓 걸립니다.
    탭.innerHTML = "";
    몸.innerHTML = `<div class="status" style="padding:14px 0;">종목을 훑는 중입니다` +
      (LD.전체 ? ` (${LD.진행}/${LD.전체})` : "") + `... 잠시 뒤 자동으로 나옵니다.</div>`;
    document.getElementById("ldMeta").textContent = "";
    document.getElementById("ldNote").textContent = "";
    clearTimeout(주도주다시);
    주도주다시 = setTimeout(주도주받기, 12000);          // 12초 뒤 다시 확인
    return;
  }

  const 세기 = 이름 => 이름 === "전체"
    ? (LD.items || []).length
    : (LD.items || []).filter(x => x.상태 === 이름).length;
  const 탭들 = ["양수 전환", "음수에서 반등", "양수에서 상승", "양수이나 둔화", "음수 전환", "전체"];
  탭.innerHTML = 탭들.map(n =>
    `<button data-ld="${n}" class="${n === LD_TAB ? "on" : ""}">${n}<b>${세기(n)}</b></button>`).join("");
  탭.querySelectorAll("[data-ld]").forEach(b =>
    b.onclick = () => { LD_TAB = b.dataset.ld; 주도주그리기(); });

  const 줄 = 주도주고르기();
  if (!줄.length) {
    몸.innerHTML = `<div class="status" style="padding:14px 0;">해당하는 종목이 없습니다.</div>`;
  } else {
    const 퍼 = v => v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(2) + "%";
    몸.innerHTML = `<table class="ld-tbl">
      <thead><tr><th>종목</th><th>등락률</th><th>오실레이터</th><th>상태</th><th>연속</th>
        <th>RS</th><th>표시</th></tr></thead>
      <tbody>${줄.map(x => `<tr>
        <td><span class="ld-nm" data-stk="${x.code}">${x.name}</span><span class="ld-cd">${x.code}</span></td>
        <td class="ld-num" style="color:${(x.changePct ?? 0) >= 0 ? UP : DOWN}">${퍼(x.changePct)}</td>
        <td class="ld-num" style="color:${(x.osc ?? 0) >= 0 ? UP : DOWN}">${x.osc == null ? "—" : x.osc.toFixed(4)}</td>
        <td><span class="ld-st ${상태색[x.상태] || "st-flat"}">${x.상태}</span></td>
        <td class="ld-num">${x.연속 == null ? "—" : x.연속 + "일"}</td>
        <td class="ld-num">${x.rs ?? "—"}</td>
        <td style="text-align:left">${
          (x.테마 || []).slice(0, 2).map(t => `<span class="ld-tag tag-th">${t}</span>`).join("") +
          (x.high60 ? `<span class="ld-tag tag-hi">新</span>` : "") +
          (x.aligned ? `<span class="ld-tag tag-al">정</span>` : "")}</td>
      </tr>`).join("")}</tbody></table>`;
    몸.querySelectorAll("[data-stk]").forEach(el =>
      el.onclick = () => {
        document.getElementById("codeInput").value = el.dataset.stk;
        loadData(el.dataset.stk);                       // 아래 차트를 그 종목으로 바꿉니다
        window.scrollTo({ top: document.querySelector(".split").offsetTop - 20, behavior: "smooth" });
      });
  }

  const 시각 = LD.generatedAt
    ? new Date(LD.generatedAt).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false })
    : "";
  document.getElementById("ldMeta").textContent =
    `${시각} 기준 · 후보 ${LD.count || 0}종목`
    + (LD.계산중 ? " · 새로 훑는 중" : "") + (LD.stale ? " · 지난 결과" : "");
  if (LD.계산중) { clearTimeout(주도주다시); 주도주다시 = setTimeout(주도주받기, 15000); }
  document.getElementById("ldNote").innerHTML =
    `<b>양수 전환</b>은 오실레이터가 0 아래에서 위로 올라선 첫날, <b>음수에서 반등</b>은 0 아래지만 전일보다 오른 상태입니다. ` +
    `<b>양수에서 상승</b>은 연속 일수가 길수록 과매수 구간일 수 있고, ` +
    `<b>음수 전환</b>은 0 위에서 아래로 내려선 첫날입니다. ` +
    `종목명을 누르면 아래 차트가 그 종목으로 바뀝니다.` +
    ((LD.themes || []).length ? `<br>오늘 오른 테마: ${LD.themes.slice(0, 6).map(t => `${t.name} ${t.changePct >= 0 ? "+" : "−"}${Math.abs(t.changePct).toFixed(2)}%`).join(" · ")}` : "");
}

async function 주도주받기() {
  try {
    const r = await fetch("/api/leader-scan", { cache: "no-store" });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    LD = d;
  } catch (e) { LD = null; }
  주도주그리기();
}
주도주받기();
setInterval(주도주받기, 180000);

</script>
