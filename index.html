<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>주간 증시 모니터</title>
<style>
  :root {
    --void:#F2F4F9; --surface:#FFFFFF; --surface2:#F0F2F8; --hair:#E1E5F0;
    --textPri:#131A2C; --textSec:#5B6483; --textTer:#8B94B0;
    --up:#E5484D; --down:#2F6FED; --amber:#B8790A; --teal:#0E9C86; --signature:#6D4FE0;
    --mono: ui-monospace, 'SF Mono', 'Roboto Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--void); color: var(--textPri); font-family: var(--sans); margin:0; padding:24px 16px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  .layout { display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
  .news-item { display:block; padding:10px 0; border-bottom:1px solid var(--hair); text-decoration:none; color:inherit; }
  .news-item:last-child { border-bottom:none; }
  .news-title { font-size:13px; line-height:1.4; color:var(--textPri); }
  .news-title:hover { color:var(--signature); }
  .news-date { font-size:10.5px; color:var(--textTer); margin-top:4px; font-family:var(--mono); }
  .news-empty { font-size:12px; color:var(--textTer); line-height:1.6; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .between { display:flex; align-items:center; justify-content:space-between; }
  .card { background: var(--surface); border:1px solid var(--hair); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow: 0 1px 3px rgba(19,26,44,0.06); }
  .eyebrow { font-size:11px; letter-spacing:2px; color:var(--textTer); font-family:var(--mono); }
  h1 { font-size:22px; margin:2px 0 0; }
  button { background: var(--surface2); border:1px solid var(--hair); color:var(--textSec); padding:8px 14px; border-radius:10px; font-size:12px; cursor:pointer; font-family:var(--sans); }
  input[type=number] { background: var(--surface2); border:1px solid var(--hair); color:var(--textPri); border-radius:8px; padding:6px 10px; font-family:var(--mono); font-size:13px; width:140px; }
  .price { font-size:40px; font-weight:700; font-family:var(--mono); letter-spacing:-1px; }
  .pct { font-size:15px; font-family:var(--mono); margin-top:2px; }
  .meta { margin-top:14px; font-size:12px; color:var(--textTer); font-family:var(--mono); display:flex; gap:16px; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(110px,1fr)); gap:12px; }
  .stat-label { color:var(--textTer); font-size:10.5px; margin-bottom:3px; }
  .stat-value { font-weight:600; font-family:var(--mono); font-size:12px; }
  .dot { display:inline-flex; align-items:center; gap:6px; font-size:10px; font-family:var(--mono); }
  .dotcircle { width:6px; height:6px; border-radius:999px; display:inline-block; }
  .macro-cell { background: var(--surface2); border-radius:10px; padding:10px 12px; }
  .macro-spark { width:100%; height:28px; display:block; margin-top:7px; }
  .stock-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:16px; margin-bottom:16px; }
  .stock-name { font-size:13px; color:var(--textSec); margin-bottom:6px; }
  .disclaimer { border:1px dashed var(--hair); border-radius:12px; padding:12px 16px; font-size:11.5px; color:var(--textTer); line-height:1.6; background: var(--surface); }
  .rank-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(250px,1fr)); gap:18px; }
  .rank-head { font-size:12px; color:var(--textSec); padding-bottom:8px; border-bottom:1px solid var(--hair); }
  .rank-row { display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--hair); }
  .rank-row:last-child { border-bottom:none; }
  .rank-no { font-family:var(--mono); font-size:11px; color:var(--textTer); width:15px; flex:none; text-align:right; }
  .rank-name { font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-code { font-family:var(--mono); font-size:10px; color:var(--textTer); margin-left:5px; }
  .rank-amt { font-family:var(--mono); font-size:12.5px; font-weight:600; flex:none; }
  .idx-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap:20px; }
  .idx-name { font-size:13px; color:var(--textSec); margin-bottom:8px; }
  .idx-value { font-size:34px; font-weight:700; font-family:var(--mono); letter-spacing:-1px; line-height:1.1; }
  .idx-chg { font-size:14px; font-family:var(--mono); margin-top:4px; }
  .idx-spark { margin-top:12px; width:100%; height:88px; display:block; }
  .idx-foot { margin-top:6px; font-size:10.5px; color:var(--textTer); font-family:var(--mono); display:flex; justify-content:space-between; }
  .idx-breadth { margin-top:10px; padding-top:10px; border-top:1px solid var(--hair); display:flex; gap:16px; flex-wrap:wrap; }
  .idx-bd { display:flex; align-items:baseline; gap:5px; font-size:11.5px; }
  .idx-bd b { font-family:var(--mono); font-size:13px; font-weight:600; }
  .idx-flow { margin-top:8px; padding-top:9px; border-top:1px solid var(--hair); display:flex; gap:8px; }
  .idx-fl { flex:1; text-align:center; background:var(--surface2); border-radius:8px; padding:7px 4px; }
  .idx-fl-l { font-size:10.5px; color:var(--textTer); margin-bottom:3px; }
  .idx-fl-v { font-family:var(--mono); font-size:14px; font-weight:600; }
  .kr2-top { display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
  .kr2-value { font-size:38px; font-weight:700; font-family:var(--mono); letter-spacing:-1px; line-height:1; }
  .kr2-chg { font-size:15px; font-family:var(--mono); padding-bottom:3px; }
  .kr2-spark { width:100%; height:110px; display:block; margin-top:14px; }
  .kr2-meta { margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--textTer); font-family:var(--mono); }
  .kr2-note { margin-top:12px; padding-top:10px; border-top:1px solid var(--hair); font-size:11px; color:var(--textTer); line-height:1.6; }
  .sup-tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .sup-tab { border:1px solid var(--hair); background:var(--surface); color:var(--textSec); border-radius:999px; padding:6px 14px; font-size:12px; font-family:inherit; cursor:pointer; }
  .sup-tab.on { background:var(--textPri); border-color:var(--textPri); color:#fff; }
  .sup-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .sup-head { font-size:12px; padding-bottom:8px; border-bottom:1px solid var(--hair); margin-bottom:2px; }
  .sup-scroll { max-height:420px; overflow-y:auto; }
  .sup-row { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--hair); }
  .sup-row:last-child { border-bottom:none; }
  .sup-no { font-family:var(--mono); font-size:10.5px; color:var(--textTer); width:20px; flex:none; text-align:right; }
  .sup-name { font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sup-mkt { font-family:var(--mono); font-size:9.5px; color:var(--textTer); margin-left:5px; }
  .sup-net { font-family:var(--mono); font-size:11px; color:var(--textTer); flex:none; width:62px; text-align:right; }
  .sup-ratio { font-family:var(--mono); font-size:12.5px; font-weight:600; flex:none; width:62px; text-align:right; }
</style>
</head>
<body data-page="day">
<div class="wrap">
  <div class="between" style="margin-bottom:20px;">
    <div>
      <div class="eyebrow">DAY SESSION MONITOR</div>
      <h1>주간 증시 모니터</h1>
    </div>
    <div class="row" style="gap:8px;">
      <a href="/night.html" style="text-decoration:none;">
        <button style="background:var(--surface2);color:var(--textSec);border:1px solid var(--hair);">야간 증시 →</button>
      </a>
      <a href="/us.html" style="text-decoration:none;">
        <button style="background:var(--surface2);color:var(--textSec);border:1px solid var(--hair);">미국 증시 →</button>
      </a>
      <a href="/flow-oscillator.html" style="text-decoration:none;">
        <button style="background:var(--signature);color:#fff;border:none;">수급오실레이터 →</button>
      </a>
      <button id="refreshBtn">↻ 새로고침</button>
    </div>
  </div>

  <div class="card">
    <div class="between" style="margin-bottom:14px;">
      <div style="font-size:13px;color:var(--textSec);">국내 지수</div>
      <span id="idxMeta" style="font-size:10.5px;color:var(--textTer);font-family:var(--mono);"></span>
    </div>
    <div class="idx-grid" id="idxGrid">
      <div class="news-empty">불러오는 중...</div>
    </div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <div style="font-size:13px;color:var(--textSec);margin-bottom:12px;">아시아 증시</div>
        <div class="grid" id="asiaGrid"></div>
      </div>

      <div class="card">
        <div style="font-size:13px;color:var(--textSec);margin-bottom:12px;">참고 지표</div>
        <div class="grid" id="macroGrid"></div>
      </div>

      <div class="card">
        <div class="between" style="margin-bottom:12px;">
          <div style="font-size:13px;color:var(--textSec);">시총대비 수급 <span style="font-size:11px;color:var(--textTer);">장중 잠정</span></div>
          <span id="supMeta" style="font-size:10.5px;color:var(--textTer);font-family:var(--mono);"></span>
        </div>
        <div class="sup-tabs" id="supTabs"></div>
        <div id="supBody"><div class="news-empty">불러오는 중...</div></div>
      </div>

      <div class="card">
        <div class="between" style="margin-bottom:12px;">
          <div style="font-size:13px;color:var(--textSec);">시총대비 수급 <span style="font-size:11px;color:var(--textTer);">마감 확정</span></div>
          <span id="finMeta" style="font-size:10.5px;color:var(--textTer);font-family:var(--mono);"></span>
        </div>
        <div class="sup-tabs" id="finTabs"></div>
        <div id="finBody"><div class="news-empty">불러오는 중...</div></div>
      </div>

      <div class="card">
        <div class="between" style="margin-bottom:12px;">
          <div style="font-size:13px;color:var(--textSec);">순매수·순매도 상위 10</div>
          <span id="rankMeta" style="font-size:10.5px;color:var(--textTer);font-family:var(--mono);"></span>
        </div>
        <div class="rank-grid">
          <div>
            <div class="rank-head">외국인</div>
            <div id="foreignRank"><div class="news-empty" style="padding-top:10px;">불러오는 중...</div></div>
          </div>
          <div>
            <div class="rank-head">기관</div>
            <div id="orgnRank"><div class="news-empty" style="padding-top:10px;">불러오는 중...</div></div>
          </div>
        </div>
      </div>

    </div>

    <div class="card" style="margin-bottom:0;">
      <div class="between" style="margin-bottom:8px;">
        <span style="font-size:13px;color:var(--textSec);">뉴스</span>
      </div>
      <div id="newsList" class="news-empty">불러오는 중...</div>
    </div>
  </div>
</div>

<script>
// 이 페이지가 주간(day)인지 야간(night)인지 구분합니다.
const PAGE = document.body.dataset.page || "day";

// 페이지별로 보여줄 참고 지표(순서대로 표시됩니다)
const MACRO_SHOW = PAGE === "day"
  ? ["YM=F","NQ=F","ES=F","RTY=F","2YY=F","^TNX","^TYX","CL=F","GC=F"]
  : ["YM=F","NQ=F","ES=F","RTY=F","^SOX","DRAM","2YY=F","^TNX","^TYX","CL=F","GC=F"];

const T = { up:"#E5484D", down:"#2F6FED", amber:"#B8790A", teal:"#0E9C86", hair:"#E1E5F0", textPri:"#131A2C", textTer:"#8B94B0" };
const STOCKS = [
  { key: "SKHX", name: "SK하이닉스", defaultClose: 1653000, demoMark: 1211.6, demoOracle: 1207.3 },
  { key: "SMSN", name: "삼성전자", defaultClose: 257000, demoMark: 188.9, demoOracle: 188.6 },
];
let walk = { fx: 1380.5, bankFx: 1380.5 };
STOCKS.forEach(s => { walk[s.key] = { mark: s.demoMark, oracle: s.demoOracle }; });

const stockGridEl = document.getElementById("stockGrid");
if (stockGridEl) stockGridEl.innerHTML = STOCKS.map(s => `
  <div class="card">
    <div class="stock-name">${s.name} <span style="color:var(--textTer);font-family:var(--mono);font-size:11px;">${s.key}</span></div>
    <div class="price" id="price_${s.key}">-</div>
    <div class="pct" id="pct_${s.key}">-</div>
    <div class="meta">
      <span id="mark_${s.key}">Mark -</span>
      <span id="oracle_${s.key}">Oracle -</span>
    </div>
    <div class="row" style="margin-top:12px;gap:8px;">
      <span style="font-size:11px;color:var(--textSec);">한국 종가</span>
      <input id="close_${s.key}" type="number" value="${s.defaultClose}" style="width:110px;" />
      <label style="font-size:11px;color:var(--textTer);display:inline-flex;align-items:center;gap:4px;cursor:pointer;">
        <input type="checkbox" id="auto_${s.key}" checked /> 자동
      </label>
      <span id="autoNote_${s.key}" style="font-size:10px;color:var(--textTer);font-family:var(--mono);"></span>
    </div>
    <div class="row" style="margin-top:12px;justify-content:space-between;">
      <div id="gauge_${s.key}" style="max-width:150px;"></div>
      <div style="text-align:right;">
        <div class="row" style="gap:6px;justify-content:flex-end;">
          <span class="dot"><span class="dotcircle" id="liveDot_${s.key}"></span><span id="liveLabel_${s.key}">DEMO</span></span>
        </div>
        <div style="font-size:10.5px;color:var(--textTer);margin-top:6px;">
          신뢰도 <span id="conf_${s.key}" style="font-weight:600;"></span><br/>
          Mark-Oracle <span id="spread_${s.key}"></span> · 거래대금 <span id="vol_${s.key}"></span>
        </div>
      </div>
    </div>
  </div>`).join("");

function fmtMacroPrimary(item){
  if (!item.live) return "-";
  if (item.type === "yield") return item.primary.toFixed(2) + "%";
  if (item.type === "commodity") return "$" + item.primary.toFixed(2);
  if (item.type === "stock") return "$" + item.primary.toFixed(2);
  if (item.type === "fx") return item.primary.toLocaleString("ko-KR", { maximumFractionDigits: 2 });
  return item.primary.toLocaleString("en-US", { maximumFractionDigits: 2 });
}
function fmtMacroChange(item){
  if (!item.live) return "";
  if (item.type === "yield") return fmtPct(item.changePts).replace("%","") + "%p";
  if (item.type === "fx") return (item.changeWon>=0?"+":"") + item.changeWon.toFixed(2) + "원";
  return fmtPct(item.changePct);
}
function macroChangeVal(item){
  if (item.type === "yield") return item.changePts;
  if (item.type === "fx") return item.changeWon;
  return item.changePct;
}
let SPARK = {};
let MACRO_ITEMS = [];

// 그래프 기준선은 화면에 표시된 숫자에서 역산합니다.
// 야후가 주는 전일종가 항목이 두 가지라 서로 어긋나는 경우가 있어,
// 등락률과 기준선이 항상 같은 값을 쓰도록 맞춥니다.
function macroPrevClose(it) {
  if (!it.live || it.primary == null) return null;
  if (it.type === "yield") return it.changePts == null ? null : it.primary - it.changePts;
  if (it.type === "fx") return it.changeWon == null ? null : it.primary - it.changeWon;
  if (it.changePct == null) return null;
  return it.primary / (1 + it.changePct / 100);
}

function miniSpark(it, color) {
  const s = SPARK[it.symbol];
  const W = 120, H = 28, PAD = 3;
  if (!s || !s.points || s.points.length < 2) {
    return `<svg class="macro-spark" viewBox="0 0 ${W} ${H}"></svg>`;
  }
  const vals = s.points;
  const prev = macroPrevClose(it);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (prev != null) { lo = Math.min(lo, prev); hi = Math.max(hi, prev); }
  if (hi === lo) { hi += 1; lo -= 1; }
  const x = i => PAD + (i / (vals.length - 1)) * (W - PAD * 2);
  const y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - PAD * 2);

  const d = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const base = prev == null ? "" :
    `<line x1="${PAD}" y1="${y(prev).toFixed(1)}" x2="${W - PAD}" y2="${y(prev).toFixed(1)}" stroke="${T.textTer}" stroke-width="1" stroke-dasharray="2 2" opacity="0.5" />`;
  const lastX = x(vals.length - 1).toFixed(1), lastY = y(vals[vals.length - 1]).toFixed(1);

  return `<svg class="macro-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${base}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    <circle cx="${lastX}" cy="${lastY}" r="1.8" fill="${color}" />
  </svg>`;
}

function renderMacroCells(items){
  return items.map(it => {
    const color = it.live ? (macroChangeVal(it) >= 0 ? T.up : T.down) : T.textTer;
    return `
      <div class="macro-cell">
        <div class="stat-label">${it.name}</div>
        <div style="font-size:13px;font-weight:600;font-family:var(--mono);">${fmtMacroPrimary(it)}</div>
        <div class="stat-value" style="font-size:13px;color:${color}">${it.live ? fmtMacroChange(it) : "DEMO"}</div>
        ${miniSpark(it, color)}
      </div>`;
  }).join("");
}

let TWSE = null;

// 대만 가권지수는 Yahoo가 20분 지연이라 대만거래소 값으로 덮어씁니다.
async function fetchTwse(){
  try {
    const r = await fetch("/api/twse", { cache: "no-store" });
    const d = await r.json();
    if (d && d.live && d.primary != null) {
      TWSE = d;
      // 거래소를 쓰기로 한 이상 그래프도 거래소 것만 씁니다.
      // 오늘 자료가 아직 없으면(개장 직후) 그래프를 비워둡니다.
      // 야후로 되돌아가면 지연·전일 데이터가 섞여 숫자와 어긋납니다.
      if (d.points && d.points.length) {
        SPARK["^TWII"] = { points: d.points, prevClose: d.prevClose };
      } else {
        delete SPARK["^TWII"];
      }
      paintMacro();
    }
  } catch (e) {
    // 실패하면 Yahoo 값이 그대로 쓰입니다.
  }
}

function applyTwse(items){
  if (!TWSE) return items;
  return items.map(it => it.symbol !== "^TWII" ? it : {
    ...it,
    live: true,
    primary: TWSE.primary,
    changePct: TWSE.changePct,
    source: "twse",
    quoteTime: TWSE.quoteTime || ""
  });
}

function paintMacro(){
  if (!MACRO_ITEMS.length) return;
  const items = applyTwse(MACRO_ITEMS);
  const asiaEl = document.getElementById("asiaGrid");
  const usEl = document.getElementById("macroGrid");
  if (asiaEl) asiaEl.innerHTML = renderMacroCells(items.filter(it => it.region === "asia"));
  if (usEl) {
    const picked = MACRO_SHOW.map(sym => items.find(it => it.symbol === sym)).filter(Boolean);
    usEl.innerHTML = renderMacroCells(picked);
  }
}

async function fetchMacroSpark(){
  try {
    const r = await fetch("/api/macro-spark", { cache: "no-store" });
    const d = await r.json();
    if (d.series) {
      SPARK = d.series;
      // 대만가권 그래프는 거래소 값만 씁니다(야후 것은 버립니다).
      if (TWSE) {
        if (TWSE.points && TWSE.points.length) {
          SPARK["^TWII"] = { points: TWSE.points, prevClose: TWSE.prevClose };
        } else {
          delete SPARK["^TWII"];
        }
      }
      paintMacro();
    }
  } catch (e) {
    // 그래프만 실패한 것이므로 숫자는 그대로 둡니다.
  }
}

async function fetchMacro(){
  const asiaEl = document.getElementById("asiaGrid");
  const usEl = document.getElementById("macroGrid");
  try {
    const r = await fetch("/api/macro", { cache: "no-store" });

function fmtWon(n){ return "₩" + Math.round(n).toLocaleString("ko-KR"); }
function fmtUsd(n){ return "$" + n.toFixed(2); }
function fmtPct(n){ return (n>=0?"+":"") + n.toFixed(2) + "%"; }

function gaugeSvg(pct){
  const clamped = Math.max(-3, Math.min(3, pct));
  const angle = (clamped/3)*90;
  const rad = (angle-90)*Math.PI/180;
  const cx=100, cy=92, r=74;
  const nx = cx + r*0.86*Math.cos(rad), ny = cy + r*0.86*Math.sin(rad);
  const zone = Math.abs(clamped)<0.8 ? T.teal : Math.abs(clamped)<1.8 ? T.amber : T.up;
  const dash = (Math.abs(angle)/180)*232.5;
  const offset = angle<0 ? 0 : -(90/180)*232.5;
  return `<svg viewBox="0 0 200 110" style="width:100%;max-width:150px;">    <path d="M 26 92 A 74 74 0 0 1 174 92" stroke="${T.hair}" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 26 92 A 74 74 0 0 1 174 92" stroke="${zone}" stroke-width="10" fill="none" stroke-linecap="round"
      stroke-dasharray="${dash} 500" stroke-dashoffset="${offset}" opacity="0.9"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${T.textPri}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4.5" fill="${T.textPri}"/>
    <text x="26" y="105" fill="${T.textTer}" font-size="9" font-family="monospace">-3%</text>
    <text x="100" y="105" fill="${T.textTer}" font-size="9" font-family="monospace" text-anchor="middle">0</text>
    <text x="174" y="105" fill="${T.textTer}" font-size="9" font-family="monospace" text-anchor="end">+3%</text>
  </svg>`;
}

async function fetchAndRender(){
  if (!document.getElementById("stockGrid")) return;
  let data = {};
  try {
    const r = await fetch("/api/market", { cache: "no-store" });
    data = await r.json();
  } catch(e) { data = {}; }

  let { fx, fxLive, bankFx, bankFxLive, symbols } = data;
  symbols = symbols || {};

  if (!fxLive) { walk.fx *= (1 + (Math.random()-0.5)*0.0008); fx = walk.fx; } else { walk.fx = fx; }
  if (!bankFxLive) { walk.bankFx *= (1 + (Math.random()-0.5)*0.0004); bankFx = walk.bankFx; } else { walk.bankFx = bankFx; }

  const removeKimchi = document.getElementById("kimchiToggle").checked;
  const effectiveFx = (removeKimchi && bankFxLive) ? bankFx : fx;

  STOCKS.forEach(s => {
    const koreanClose = Number(document.getElementById(`close_${s.key}`).value) || 0;
    const live = symbols[s.key];
    let mark, oracle, funding, oi, vol24h, isLive;

    if (live) {
      mark = live.mark; oracle = live.oracle; funding = live.funding; oi = live.oi; vol24h = live.vol24h;
      isLive = true;
      walk[s.key].mark = mark; walk[s.key].oracle = oracle;
    } else {
      walk[s.key].mark *= (1 + (Math.random()-0.5)*0.003);
      walk[s.key].oracle *= (1 + (Math.random()-0.5)*0.0015);
      mark = walk[s.key].mark; oracle = walk[s.key].oracle;
      funding = 0.0018 + (Math.random()-0.5)*0.001;
      oi = 5000000 + Math.random()*1000000;
      vol24h = 8000000 + Math.random()*2000000;
      isLive = false;
    }

    const impliedKrw = mark * effectiveFx;
    const changePct = (impliedKrw/koreanClose - 1) * 100;
    const spreadPct = ((mark - oracle)/oracle) * 100;

    const priceEl = document.getElementById(`price_${s.key}`);
    priceEl.textContent = fmtWon(impliedKrw);
    priceEl.style.color = changePct>=0 ? T.up : T.down;
    const pctEl = document.getElementById(`pct_${s.key}`);
    pctEl.textContent = fmtPct(changePct) + " vs 한국 종가";
    pctEl.style.color = changePct>=0 ? T.up : T.down;
    document.getElementById(`mark_${s.key}`).textContent = "Mark " + fmtUsd(mark);
    document.getElementById(`oracle_${s.key}`).textContent = "Oracle " + fmtUsd(oracle);
    document.getElementById(`gauge_${s.key}`).innerHTML = gaugeSvg(changePct);

    document.getElementById(`liveLabel_${s.key}`).textContent = isLive ? "LIVE" : "DEMO";
    document.getElementById(`liveDot_${s.key}`).style.background = isLive ? T.teal : "#8B94B0";

    let confLabel="높음", confColor=T.teal;
    if (Math.abs(spreadPct)>1.5 || vol24h<8000000){ confLabel="낮음"; confColor=T.up; }
    else if (Math.abs(spreadPct)>0.6 || vol24h<15000000){ confLabel="보통"; confColor=T.amber; }
    const confEl = document.getElementById(`conf_${s.key}`);
    confEl.textContent = confLabel; confEl.style.color = confColor;
    document.getElementById(`spread_${s.key}`).textContent = fmtPct(spreadPct);
    document.getElementById(`vol_${s.key}`).textContent = "$" + (vol24h/1e6).toFixed(1) + "m";

    localStorage.setItem(`close_${s.key}`, koreanClose);
  });

  document.getElementById("updatedAt").textContent =
    "업데이트 " + new Date().toLocaleTimeString("ko-KR") +
    " · USD/KRW(업비트) " + fx.toFixed(2) +
    " · USD/KRW(은행간) " + bankFx.toFixed(2);
}

function timeAgo(pubDate){
  const diffMin = Math.max(0, Math.round((Date.now() - new Date(pubDate).getTime()) / 60000));
  if (diffMin < 60) return diffMin + "분 전";
  const h = Math.round(diffMin/60);
  if (h < 24) return h + "시간 전";
  return Math.round(h/24) + "일 전";
}

function renderKr200(d) {
  const up = (d.changePts ?? 0) >= 0;
  const color = up ? T.up : T.down;
  const sign = up ? "+" : "−";
  const pts = d.changePts == null ? "—" : sign + Math.abs(d.changePts).toFixed(2);
  const pct = d.changePct == null ? "" : ` (${sign}${Math.abs(d.changePct).toFixed(2)}%)`;

  const W = 700, H = 110, PAD = 8;
  let svg = "";
  if (d.points && d.points.length > 1) {
    const vals = d.points.slice();
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (d.prevDay != null) { lo = Math.min(lo, d.prevDay); hi = Math.max(hi, d.prevDay); }
    if (hi === lo) { hi += 1; lo -= 1; }
    const x = i => PAD + (i / (vals.length - 1)) * (W - PAD * 2);
    const y = v => PAD + (1 - (v - lo) / (hi - lo)) * (H - PAD * 2);
    const path = vals.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    const base = d.prevDay == null ? "" :
      `<line x1="${PAD}" y1="${y(d.prevDay).toFixed(1)}" x2="${W - PAD}" y2="${y(d.prevDay).toFixed(1)}" stroke="${T.textTer}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55" />`;
    svg = `<svg class="kr2-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${base}
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
      <circle cx="${x(vals.length - 1).toFixed(1)}" cy="${y(vals[vals.length - 1]).toFixed(1)}" r="3" fill="${color}" />
    </svg>`;
  }

  // 정규장 종가 대비 갭 — 다음 날 시초가 방향을 가늠하는 지표
  let gapBlock = "";
  if (KOSPI200_CLOSE) {
    const gapPts = d.mark - KOSPI200_CLOSE;
    const gapPct = (gapPts / KOSPI200_CLOSE) * 100;
    const gUp = gapPts >= 0;
    const gc = gUp ? T.up : T.down;
    const gs = gUp ? "+" : "−";
    gapBlock = `<div class="idx-flow" style="margin-top:12px;">
      <div class="idx-fl">
        <div class="idx-fl-l">정규장 종가</div>
        <div class="idx-fl-v" style="color:var(--textPri)">${KOSPI200_CLOSE.toFixed(2)}</div>
      </div>
      <div class="idx-fl">
        <div class="idx-fl-l">종가 대비 갭</div>
        <div class="idx-fl-v" style="color:${gc}">${gs}${Math.abs(gapPct).toFixed(2)}%</div>
      </div>
      <div class="idx-fl">
        <div class="idx-fl-l">포인트 차</div>
        <div class="idx-fl-v" style="color:${gc}">${gs}${Math.abs(gapPts).toFixed(2)}</div>
      </div>
    </div>`;
  }

  const hhmm = ms => {
    const dt = new Date(ms);
    return dt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Seoul" });
  };
  const startTxt = d.sessionStart ? hhmm(d.sessionStart) : "";
  const endTxt = d.sessionStart && d.points && d.points.length
    ? hhmm(Math.min(Date.now(), d.sessionStart + (d.points.length - 1) * 300000)) : "";

  return `
    <div class="kr2-top">
      <div class="kr2-value" style="color:${color}">${d.mark.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
      <div class="kr2-chg" style="color:${color}">${pts}${pct}</div>
      <div class="dot" style="margin-left:auto;padding-bottom:4px;color:var(--textTer);"><span class="dotcircle" style="background:${T.teal}"></span>LIVE</div>
    </div>
    ${svg}
    <div class="kr2-meta">
      <span>${startTxt}</span>
      <span style="margin-left:auto;">${endTxt}</span>
    </div>
    ${gapBlock}
    <div class="kr2-meta">
      <span>Mark ${d.mark}</span>
      <span>Oracle ${d.oracle}</span>
      <span>전일 ${d.prevDay}</span>
      <span>미결제 ${Math.round(d.openInterest).toLocaleString("ko-KR")}</span>
    </div>
    <div class="kr2-note">
      ⚠ KRX가 공식 산출·배포하는 야간선물 시세가 아닙니다. 해외 파생상품 거래소(Hyperliquid)에서
      형성된 코스피200 24시간 계약의 체결가로, 야간 흐름을 가늠하는 참고값입니다.
      거래량이 얕어 실제 시장 대비 가격이 크게 튈 수 있습니다.
    </div>`;
}

function sparkPath(points, w, h, pad) {
  const vals = points.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += 1; lo -= 1; }
  const span = hi - lo;
  const x = i => pad + (i / Math.max(1, points.length - 1)) * (w - pad * 2);
  const y = v => pad + (1 - (v - lo) / span) * (h - pad * 2);
  return {
    d: points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1)).join(" "),
    y, lo, hi
  };
}

function renderIndexCard(label, o) {
  if (!o || o.value == null) {
    return `<div><div class="idx-name">${label}</div><div class="news-empty">데이터 없음</div></div>`;
  }
  const up = (o.changePts ?? 0) >= 0;
  const color = up ? T.up : T.down;
  const pts = o.changePts == null ? "—" : (up ? "+" : "−") + Math.abs(o.changePts).toFixed(2);
  const pct = o.changePct == null ? "" : ` (${up ? "+" : "−"}${Math.abs(o.changePct).toFixed(2)}%)`;

  // 기준선은 화면에 보이는 등락폭에서 역산해, 숫자와 그래프가 어긋나지 않게 합니다.
  const prevLine = (o.changePts != null && o.value != null) ? o.value - o.changePts : o.prevClose;

  const W = 560, H = 88, PAD = 6;
  let svg = "";
  if (o.points && o.points.length > 1) {
    const s = sparkPath(o.points, W, H, PAD);
    const base = (prevLine != null && prevLine >= s.lo && prevLine <= s.hi)
      ? `<line x1="${PAD}" y1="${s.y(prevLine).toFixed(1)}" x2="${W - PAD}" y2="${s.y(prevLine).toFixed(1)}" stroke="${T.textTer}" stroke-width="1" stroke-dasharray="3 3" opacity="0.55" />`
      : "";
    svg = `<svg class="idx-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${base}
      <path d="${s.d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    </svg>`;
  }

  const first = o.points && o.points.length ? o.points[0].t : "";
  const last = o.points && o.points.length ? o.points[o.points.length - 1].t : "";
  const hhmm = t => (t && t.length === 4) ? t.slice(0, 2) + ":" + t.slice(2) : "";

  let breadth = "";
  if (o.rising != null || o.falling != null) {
    const n = v => v == null ? "—" : v.toLocaleString("ko-KR");
    const lim = (v, label) => (v ? `<span style="color:var(--textTer);font-size:10.5px;">${label} ${v}</span>` : "");
    const tv = o.tradeValue == null ? "" :
      `<div class="idx-bd" style="margin-left:auto;color:var(--textTer)">거래대금 <b style="color:var(--textSec)">${Math.round(o.tradeValue / 100).toLocaleString("ko-KR")}</b>억</div>`;
    breadth = `<div class="idx-breadth">
      <div class="idx-bd" style="color:var(--textTer)">상승 <b style="color:${T.up}">${n(o.rising)}</b> ${lim(o.upperLimit, "상한")}</div>
      <div class="idx-bd" style="color:var(--textTer)">보합 <b style="color:var(--textSec)">${n(o.flat)}</b></div>
      <div class="idx-bd" style="color:var(--textTer)">하락 <b style="color:${T.down}">${n(o.falling)}</b> ${lim(o.lowerLimit, "하한")}</div>
      ${tv}
    </div>`;
  }

  let flow = "";
  if (o.flow) {
    const cell = (label, v) => {
      const c = v == null ? T.textTer : (v >= 0 ? T.up : T.down);
      const txt = v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toLocaleString("ko-KR");
      return `<div class="idx-fl">
        <div class="idx-fl-l">${label}</div>
        <div class="idx-fl-v" style="color:${c}">${txt}</div>
      </div>`;
    };
    flow = `<div class="idx-flow">
      ${cell("개인", o.flow.individual)}
      ${cell("외국인", o.flow.foreign)}
      ${cell("기관", o.flow.institution)}
    </div>`;
  }

  return `<div>
    <div class="idx-name">${label}</div>
    <div class="idx-value" style="color:${color}">${o.value.toLocaleString("ko-KR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
    <div class="idx-chg" style="color:${color}">${pts}${pct}</div>
    ${svg}
    <div class="idx-foot"><span>${hhmm(first)}</span><span>${hhmm(last)}</span></div>
    ${breadth}
    ${flow}
  </div>`;
}

// 키움에서 받은 국내 시세로 '한국 종가' 칸을 자동으로 채웁니다.
// '자동' 체크를 끄거나 직접 값을 고치면 그때부터 손입력 값을 유지합니다.
function applyKrStocks(stocks) {
  if (!stocks) return;
  let changed = false;
  STOCKS.forEach(s => {
    const q = stocks[s.key];
    const auto = document.getElementById(`auto_${s.key}`);
    const input = document.getElementById(`close_${s.key}`);
    const note = document.getElementById(`autoNote_${s.key}`);
    if (!q || !input || !auto) return;

    if (auto.checked) {
      if (Number(input.value) !== q.price) {
        input.value = q.price;
        localStorage.setItem(`close_${s.key}`, q.price);
        changed = true;
      }
      if (note) note.textContent = q.changePct == null ? "키움"
        : `키움 ${q.changePct >= 0 ? "+" : "−"}${Math.abs(q.changePct).toFixed(2)}%`;
    } else if (note) {
      note.textContent = "수동";
    }
  });
  if (changed) fetchAndRender();
}

async function fetchIndexIntraday() {
  const grid = document.getElementById("idxGrid");
  try {
    const r = await fetch("/api/index-intraday", { cache: "no-store" });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    if (grid) grid.innerHTML = renderIndexCard("코스피", d.kospi) + renderIndexCard("코스닥", d.kosdaq);
    applyKrStocks(d.stocks);
    if (d.kospi200 && d.kospi200.value != null) {
      KOSPI200_CLOSE = d.kospi200.value;
      if (LAST_KR200) fetchKr200Repaint();
    }
    const day = (d.kospi && d.kospi.date) || "";
    const im = document.getElementById("idxMeta");
    if (im) im.textContent =
      (day.length === 8 ? `${day.slice(0, 4)}.${day.slice(4, 6)}.${day.slice(6, 8)} · ` : "") + "당일 1분봉 · 순매수 억원";
  } catch (e) {
    if (grid) grid.innerHTML = `<div class="news-empty">지수를 불러오지 못했습니다.</div>`;
  }
}

STOCKS.forEach(s => {
  if (!document.getElementById(`close_${s.key}`)) return;
  const saved = localStorage.getItem(`close_${s.key}`);
  if (saved) document.getElementById(`close_${s.key}`).value = saved;

  const autoEl = document.getElementById(`auto_${s.key}`);
  const savedAuto = localStorage.getItem(`auto_${s.key}`);
  if (savedAuto !== null) autoEl.checked = savedAuto === "1";

  // 사용자가 직접 값을 고치면 자동을 끕니다.
  document.getElementById(`close_${s.key}`).addEventListener("change", () => {
    autoEl.checked = false;
    localStorage.setItem(`auto_${s.key}`, "0");
    const note = document.getElementById(`autoNote_${s.key}`);
    if (note) note.textContent = "수동";
    fetchAndRender();
  });

  autoEl.addEventListener("change", () => {
    localStorage.setItem(`auto_${s.key}`, autoEl.checked ? "1" : "0");
    if (autoEl.checked) fetchIndexIntraday();
    else {
      const note = document.getElementById(`autoNote_${s.key}`);
      if (note) note.textContent = "수동";
    }
  });
});
document.getElementById("refreshBtn").addEventListener("click", () => { fetchAndRender(); fetchInvestorRank(); fetchIndexIntraday(); fetchMacroSpark(); fetchTwse(); fetchKr200(); fetchSupplyRatio(); fetchFinalSupply(); });
const kimchiEl = document.getElementById("kimchiToggle");
if (kimchiEl) kimchiEl.addEventListener("change", fetchAndRender);
fetchAndRender();
fetchNews();
fetchMacro();
fetchMacroSpark();
fetchTwse();
fetchKr200();
fetchSupplyRatio();
fetchFinalSupply();
fetchInvestorRank();
fetchIndexIntraday();
setInterval(fetchAndRender, 6000);
setInterval(fetchNews, 60000);
setInterval(fetchMacro, 60000);
setInterval(fetchMacroSpark, 60000);
setInterval(fetchTwse, 30000);
setInterval(fetchKr200, 15000);
setInterval(fetchSupplyRatio, 300000);
setInterval(fetchFinalSupply, 600000);
setInterval(fetchInvestorRank, 600000);
setInterval(fetchIndexIntraday, 30000);
</script>
